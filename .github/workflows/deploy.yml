name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Build main webapp
      - name: Install webapp dependencies
        working-directory: ./webapp
        run: npm ci
      - name: Build webapp
        working-directory: ./webapp
        run: npx astro build

      # Build pricing tool (pricing-data.json is pre-built and committed)
      - name: Install pricing tool dependencies
        working-directory: ./pricing-tool
        run: npm ci
      - name: Build pricing tool
        working-directory: ./pricing-tool
        run: npx vite build

      # Copy pricing tool into webapp dist
      - name: Deploy pricing tool to /pricing/
        run: |
          mkdir -p ./webapp/dist/pricing
          cp -r ./pricing-tool/dist/* ./webapp/dist/pricing/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./webapp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
